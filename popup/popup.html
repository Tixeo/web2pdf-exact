<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="popup.css" />
    <title>Web2PDF Exact</title>
  </head>
  <body>
    <header class="top">
      <img src="../icons/icon.svg" alt="" class="logo" />
      <div class="titles">
        <h1>Web2PDF Exact</h1>
        <p class="page" id="page">…</p>
      </div>
      <button class="icon-btn" id="openOptions" data-i18n-title="allSettings" data-i18n-aria="allSettings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.3 2.6a7.4 7.4 0 0 0-1.8 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.8 1l.3 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main id="controls">
      <section class="field">
        <span class="label" id="scopeLabel" data-i18n="popupScope">Area</span>
        <div class="seg" data-key="scope" role="radiogroup" aria-labelledby="scopeLabel">
          <button type="button" data-value="full" data-i18n="scopeFull">Whole page</button>
          <button type="button" data-value="visible" data-i18n="scopeVisible">Visible</button>
          <button type="button" data-value="element" data-i18n="scopeElement">Element</button>
          <button type="button" data-value="region" data-i18n="scopeRegion">Region</button>
        </div>
      </section>

      <section class="field">
        <span class="label" id="formatLabel" data-i18n="popupFormat">Format</span>
        <div class="row">
          <select data-key="pageFormat" aria-labelledby="formatLabel">
            <option value="single" data-i18n="fmtSingle">Single page (no breaks)</option>
            <option value="a4" data-i18n="fmtA4">A4</option>
            <option value="a3" data-i18n="fmtA3">A3</option>
            <option value="a5" data-i18n="fmtA5">A5</option>
            <option value="letter" data-i18n="fmtLetter">US Letter</option>
            <option value="legal" data-i18n="fmtLegal">US Legal</option>
            <option value="tabloid" data-i18n="fmtTabloid">Tabloid</option>
            <option value="screen" data-i18n="fmtScreen">Screen (one page per screen)</option>
            <option value="custom" data-i18n="fmtCustomMenu">Custom…</option>
          </select>
          <div class="seg compact" data-key="orientation" role="radiogroup" aria-labelledby="formatLabel">
            <button type="button" data-value="portrait" data-i18n-title="orientPortrait" data-i18n-aria="orientPortrait">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="4" y="2" width="8" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
            <button type="button" data-value="landscape" data-i18n-title="orientLandscape" data-i18n-aria="orientLandscape">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="4" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="field">
        <span class="label" id="ratioLabel" data-i18n="popupSharpness">Sharpness</span>
        <div class="seg" data-key="pixelRatio" role="radiogroup" aria-labelledby="ratioLabel">
          <button type="button" data-value="0" data-i18n="ratioScreen" data-i18n-title="ratioScreenTitle">Screen</button>
          <button type="button" data-value="1">×1</button>
          <button type="button" data-value="2">×2</button>
          <button type="button" data-value="3">×3</button>
          <button type="button" data-value="4">×4</button>
        </div>
      </section>

      <details class="more" id="more">
        <summary data-i18n="popupMore">Engine and quick options</summary>
        <div class="seg" data-key="engine" role="radiogroup" data-i18n-aria="popupMore">
          <button type="button" data-value="exact" data-i18n="engineExact">Exact, pixel for pixel</button>
          <button type="button" data-value="vector" data-i18n="engineVector">Vector (printing)</button>
        </div>
        <p class="hint" id="engineHint"></p>
        <label class="check"><input type="checkbox" data-key="floatingHide" /> <span data-i18n="optHideFixed">Hide fixed elements (banners, chat…)</span></label>
        <label class="check"><input type="checkbox" data-key="cleanupBefore" /> <span data-i18n="optCleanup">Remove elements before capturing</span></label>
        <label class="check"><input type="checkbox" data-key="headerFooter" /> <span data-i18n="optHeaderFooter">Header and footer (title, address, date, page no.)</span></label>
        <label class="check"><input type="checkbox" data-key="saveAs" /> <span data-i18n="optSaveAs">Choose where to save the file</span></label>
      </details>
    </main>

    <button id="go" class="primary" type="button">
      <span data-i18n="btnConvert">Convert to PDF</span>
      <kbd data-i18n="kbdEnter">Enter</kbd>
    </button>

    <section class="status" id="status" hidden aria-live="polite">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="status-row">
        <span id="statusText" data-i18n="statusDefault">Converting…</span>
        <button type="button" class="link" id="cancel" data-i18n="btnCancel">Cancel</button>
      </div>
      <p class="hint" id="statusHint" data-i18n="hintScroll"></p>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="result-head">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L21 7.5 19.6 6z" /></svg>
        <span id="resultText"></span>
      </div>
      <p class="warn" id="resultWarn" hidden></p>
      <div class="result-actions">
        <button type="button" id="openPdf" data-i18n="btnOpenPdf">Open PDF</button>
        <button type="button" id="showPdf" data-i18n="btnShowPdf">Show in folder</button>
      </div>
    </section>

    <section class="error" id="error" hidden role="alert"></section>

    <footer>
      <span class="credit" data-i18n="credit">Designed with the help of Wheeloh resources</span>
    </footer>

    <script src="../lib/i18n.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
