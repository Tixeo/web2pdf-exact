<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="popup.css" />
    <title>Web2PDF Exact</title>
  </head>
  <body>
    <header class="top">
      <img src="../icons/icon.svg" alt="" class="logo" />
      <div class="titles">
        <h1>Web2PDF Exact</h1>
        <p class="page" id="page">…</p>
      </div>
      <button class="icon-btn" id="openOptions" title="Tous les réglages" aria-label="Tous les réglages">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.3 2.6a7.4 7.4 0 0 0-1.8 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.8 1l.3 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main id="controls">
      <section class="field">
        <span class="label">Zone</span>
        <div class="seg" data-key="scope" role="radiogroup" aria-label="Zone à convertir">
          <button type="button" data-value="full">Page entière</button>
          <button type="button" data-value="visible">Visible</button>
          <button type="button" data-value="element">Élément</button>
          <button type="button" data-value="region">Zone</button>
        </div>
      </section>

      <section class="field">
        <span class="label">Format</span>
        <div class="row">
          <select data-key="pageFormat" aria-label="Format de page">
            <option value="single">Page unique (sans coupure)</option>
            <option value="a4">A4</option>
            <option value="a3">A3</option>
            <option value="a5">A5</option>
            <option value="letter">Lettre US</option>
            <option value="legal">Légal US</option>
            <option value="tabloid">Tabloïd</option>
            <option value="screen">Écran (une page par écran)</option>
            <option value="custom">Personnalisé…</option>
          </select>
          <div class="seg compact" data-key="orientation" role="radiogroup" aria-label="Orientation">
            <button type="button" data-value="portrait" title="Portrait">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="4" y="2" width="8" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
            <button type="button" data-value="landscape" title="Paysage">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="4" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="field">
        <span class="label">Netteté</span>
        <div class="seg" data-key="pixelRatio" role="radiogroup" aria-label="Résolution">
          <button type="button" data-value="0" title="Résolution de votre écran">Écran</button>
          <button type="button" data-value="1">×1</button>
          <button type="button" data-value="2">×2</button>
          <button type="button" data-value="3">×3</button>
          <button type="button" data-value="4">×4</button>
        </div>
      </section>

      <details class="more" id="more">
        <summary>Moteur et options rapides</summary>
        <div class="seg" data-key="engine" role="radiogroup" aria-label="Moteur">
          <button type="button" data-value="exact">Exact, au pixel près</button>
          <button type="button" data-value="vector">Vectoriel (impression)</button>
        </div>
        <p class="hint" id="engineHint"></p>
        <label class="check"><input type="checkbox" data-key="floatingHide" /> Masquer les éléments fixes (bandeaux, chat…)</label>
        <label class="check"><input type="checkbox" data-key="cleanupBefore" /> Retirer des éléments avant la capture</label>
        <label class="check"><input type="checkbox" data-key="headerFooter" /> En-tête et pied de page (titre, adresse, date, n°)</label>
        <label class="check"><input type="checkbox" data-key="saveAs" /> Choisir l’emplacement du fichier</label>
      </details>
    </main>

    <button id="go" class="primary" type="button">
      <span>Convertir en PDF</span>
      <kbd>Entrée</kbd>
    </button>

    <section class="status" id="status" hidden aria-live="polite">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="status-row">
        <span id="statusText">Préparation…</span>
        <button type="button" class="link" id="cancel">Annuler</button>
      </div>
      <p class="hint" id="statusHint">La page défile toute seule pendant la capture : laissez-la faire. Échap pour interrompre.</p>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="result-head">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L21 7.5 19.6 6z" /></svg>
        <span id="resultText">PDF prêt</span>
      </div>
      <p class="warn" id="resultWarn" hidden></p>
      <div class="result-actions">
        <button type="button" id="openPdf">Ouvrir le PDF</button>
        <button type="button" id="showPdf">Afficher dans le dossier</button>
      </div>
    </section>

    <section class="error" id="error" hidden role="alert"></section>

    <footer>
      <span class="credit">Conçu avec l’aide des ressources de Wheeloh</span>
    </footer>

    <script src="../lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
