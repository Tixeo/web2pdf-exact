<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Thème sombre</title>
    <style>
      html { background: #12141a; color: #e6e8ee; }
      body { max-width: 760px; margin: 0 auto; padding: 48px 24px; font: 17px/1.7 system-ui, sans-serif; }
      h2 { color: #8ab4ff; }
      @media print { body { display: none; } }
    </style>
  </head>
  <body>
    <h1>Documentation en thème sombre</h1>
    <script>
      for (let i = 1; i <= 24; i++) {
        document.write(`<h2>Chapitre ${i}</h2><p>Ligne de texte du chapitre ${i}. ` + 'Contenu suffisamment long pour remplir plusieurs pages au format A4 et vérifier les coupures. '.repeat(5) + '</p>');
      }
    </script>
  </body>
</html>
