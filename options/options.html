<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Web2PDF Exact</title>
    <link rel="icon" href="../icons/icon.svg" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="hero">
      <img src="../icons/icon.svg" alt="" width="44" height="44" />
      <div>
        <h1>Web2PDF Exact</h1>
        <p data-i18n="optIntro"></p>
      </div>
      <span class="saved" id="saved" aria-live="polite"></span>
    </header>

    <nav class="toc">
      <a href="#moteur" data-i18n="tocEngine"></a>
      <a href="#capture" data-i18n="tocCapture"></a>
      <a href="#qualite" data-i18n="tocQuality"></a>
      <a href="#page" data-i18n="tocLayout"></a>
      <a href="#contenu" data-i18n="tocContent"></a>
      <a href="#fichier" data-i18n="tocFile"></a>
      <a href="#vectoriel" data-i18n="tocVector"></a>
      <a href="#menus" data-i18n="tocMenus"></a>
    </nav>

    <main>
      <section id="moteur" class="card">
        <h2 data-i18n="secEngine"></h2>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="engine" value="exact" />
            <span>
              <strong data-i18n="engExactTitle"></strong> <em class="tag" data-i18n="tagRecommended"></em>
              <small data-i18n="engExactDesc"></small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="engine" value="vector" />
            <span>
              <strong data-i18n="engVectorTitle"></strong>
              <small data-i18n="engVectorDesc"></small>
            </span>
          </label>
        </div>
      </section>

      <section id="capture" class="card">
        <h2 data-i18n="secCapture"></h2>
        <div class="grid">
          <label class="field">
            <span data-i18n="fldScope"></span>
            <select name="scope">
              <option value="full" data-i18n="optScopeFull"></option>
              <option value="visible" data-i18n="optScopeVisible"></option>
              <option value="element" data-i18n="optScopeElement"></option>
              <option value="region" data-i18n="optScopeRegion"></option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="fldMethod"></span>
            <select name="captureMethod">
              <option value="auto" data-i18n="methodAuto"></option>
              <option value="scroll" data-i18n="methodScroll"></option>
              <option value="direct" data-i18n="methodDirect"></option>
            </select>
            <small data-i18n="methodHelp"></small>
          </label>
          <label class="field">
            <span data-i18n="fldFloating"></span>
            <select name="floating">
              <option value="once" data-i18n="floatingOnce"></option>
              <option value="hide" data-i18n="floatingHide"></option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="fldSettle"></span>
            <span class="unit"><input type="number" name="settleDelay" min="0" max="5000" step="50" /> <span data-i18n="unitMs"></span></span>
            <small data-i18n="settleHelp"></small>
          </label>
          <label class="field">
            <span data-i18n="fldStartDelay"></span>
            <span class="unit"><input type="number" name="startDelay" min="0" max="60" step="1" /> <span data-i18n="unitS"></span></span>
            <small data-i18n="startDelayHelp"></small>
          </label>
          <label class="field">
            <span data-i18n="fldMaxHeight"></span>
            <span class="unit"><input type="number" name="maxHeight" min="1000" max="500000" step="1000" /> <span data-i18n="unitPx"></span></span>
            <small data-i18n="maxHeightHelp"></small>
          </label>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" name="preloadLazy" /> <span data-i18n="chkPreload"></span></label>
          <label class="check"><input type="checkbox" name="freezeAnimations" /> <span data-i18n="chkFreeze"></span></label>
          <label class="check"><input type="checkbox" name="scrollContainer" /> <span data-i18n="chkContainer"></span></label>
          <label class="check"><input type="checkbox" name="horizontalOverflow" /> <span data-i18n="chkOverflow"></span></label>
          <label class="check"><input type="checkbox" name="cleanupBefore" /> <span data-i18n="chkCleanup"></span></label>
        </div>
      </section>

      <section id="qualite" class="card">
        <h2 data-i18n="secQuality"></h2>
        <div class="grid">
          <label class="field">
            <span data-i18n="fldRatio"></span>
            <select name="pixelRatio">
              <option value="0" data-i18n="ratio0"></option>
              <option value="1" data-i18n="ratio1"></option>
              <option value="1.5" data-i18n="ratio15"></option>
              <option value="2" data-i18n="ratio2"></option>
              <option value="3" data-i18n="ratio3"></option>
              <option value="4" data-i18n="ratio4"></option>
            </select>
            <small data-i18n="ratioHelp"></small>
          </label>
          <label class="field">
            <span data-i18n="fldCompression"></span>
            <select name="imageFormat">
              <option value="auto" data-i18n="compAuto"></option>
              <option value="lossless" data-i18n="compLossless"></option>
              <option value="jpeg" data-i18n="compJpeg"></option>
            </select>
            <small data-i18n="compHelp"></small>
          </label>
          <label class="field">
            <span><span data-i18n="fldJpegQuality"></span> <output id="jpegQualityOut"></output></span>
            <input type="range" name="jpegQuality" min="50" max="100" step="1" />
            <small data-i18n="jpegHelp"></small>
          </label>
        </div>
      </section>

      <section id="page" class="card">
        <h2 data-i18n="secLayout"></h2>
        <div class="grid">
          <label class="field">
            <span data-i18n="fldFormat"></span>
            <select name="pageFormat">
              <option value="single" data-i18n="fmtSingle"></option>
              <option value="a4" data-i18n="fmtA4"></option>
              <option value="a3" data-i18n="fmtA3"></option>
              <option value="a5" data-i18n="fmtA5"></option>
              <option value="letter" data-i18n="fmtLetter"></option>
              <option value="legal" data-i18n="fmtLegal"></option>
              <option value="tabloid" data-i18n="fmtTabloid"></option>
              <option value="screen" data-i18n="fmtScreen"></option>
              <option value="custom" data-i18n="fmtCustom"></option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="fldOrientation"></span>
            <select name="orientation">
              <option value="portrait" data-i18n="orientPortrait"></option>
              <option value="landscape" data-i18n="orientLandscape"></option>
            </select>
          </label>
          <label class="field" data-show="custom">
            <span data-i18n="fldCustomW"></span>
            <span class="unit"><input type="number" name="customWidthMm" min="20" max="5000" step="1" /> <span data-i18n="unitMm"></span></span>
          </label>
          <label class="field" data-show="custom">
            <span data-i18n="fldCustomH"></span>
            <span class="unit"><input type="number" name="customHeightMm" min="20" max="5000" step="1" /> <span data-i18n="unitMm"></span></span>
          </label>
          <label class="field">
            <span data-i18n="fldFit"></span>
            <select name="fit">
              <option value="width" data-i18n="fitWidth"></option>
              <option value="actual" data-i18n="fitActual"></option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="fldMarginColor"></span>
            <select name="marginColor">
              <option value="page" data-i18n="marginPage"></option>
              <option value="white" data-i18n="marginWhite"></option>
            </select>
          </label>
        </div>
        <fieldset class="margins">
          <legend data-i18n="legendMargins"></legend>
          <label><span data-i18n="marginTop"></span> <input type="number" name="marginTop" min="0" max="100" step="1" /></label>
          <label><span data-i18n="marginRight"></span> <input type="number" name="marginRight" min="0" max="100" step="1" /></label>
          <label><span data-i18n="marginBottom"></span> <input type="number" name="marginBottom" min="0" max="100" step="1" /></label>
          <label><span data-i18n="marginLeft"></span> <input type="number" name="marginLeft" min="0" max="100" step="1" /></label>
        </fieldset>
        <div class="checks">
          <label class="check"><input type="checkbox" name="smartBreaks" /> <span data-i18n="chkSmartBreaks"></span></label>
          <label class="check"><input type="checkbox" name="limitPageSize" /> <span data-i18n="chkLimitSize"></span></label>
          <label class="check"><input type="checkbox" name="headerFooter" /> <span data-i18n="chkHeaderFooter"></span></label>
        </div>
      </section>

      <section id="contenu" class="card">
        <h2 data-i18n="secContent"></h2>
        <div class="checks">
          <label class="check"><input type="checkbox" name="textLayer" /> <span data-i18n="chkTextLayer"></span></label>
          <label class="check"><input type="checkbox" name="links" /> <span data-i18n="chkLinks"></span></label>
          <label class="check"><input type="checkbox" name="bookmarks" /> <span data-i18n="chkBookmarks"></span></label>
        </div>
      </section>

      <section id="fichier" class="card">
        <h2 data-i18n="secFile"></h2>
        <div class="grid">
          <label class="field wide">
            <span data-i18n="fldFilename"></span>
            <input type="text" name="filenameTemplate" spellcheck="false" />
            <small data-i18n="filenameHelp"></small>
            <small class="preview"><span data-i18n="previewLabel"></span> <span id="filenamePreview"></span></small>
          </label>
          <label class="field">
            <span data-i18n="fldAfter"></span>
            <select name="afterAction">
              <option value="download" data-i18n="afterDownload"></option>
              <option value="download-open" data-i18n="afterDownloadOpen"></option>
              <option value="open" data-i18n="afterOpen"></option>
            </select>
          </label>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" name="saveAs" /> <span data-i18n="chkSaveAs"></span></label>
          <label class="check"><input type="checkbox" name="notify" /> <span data-i18n="chkNotify"></span></label>
        </div>
      </section>

      <section id="vectoriel" class="card">
        <h2 data-i18n="secVector"></h2>
        <div class="checks">
          <label class="check"><input type="checkbox" name="vectorEmulateScreen" /> <span data-i18n="chkEmulateScreen"></span></label>
          <label class="check"><input type="checkbox" name="vectorFitWidth" /> <span data-i18n="chkFitWidth"></span></label>
        </div>
        <p class="note" data-i18n="vectorNote"></p>
      </section>

      <section id="menus" class="card">
        <h2 data-i18n="secMenus"></h2>
        <div class="grid">
          <label class="field wide">
            <span data-i18n="fldContextMenu"></span>
            <select name="contextMenu">
              <option value="direct" data-i18n="ctxDirect"></option>
              <option value="full" data-i18n="ctxFull"></option>
            </select>
            <small data-i18n="ctxHelp"></small>
          </label>
        </div>
        <p data-i18n="shortcutsText"></p>
        <p data-i18n="escText"></p>
      </section>

      <div class="actions">
        <button type="button" id="reset" data-i18n="btnReset"></button>
      </div>
    </main>

    <footer>
      <span>
        Web2PDF Exact <span id="version"></span> ·
        <a href="https://github.com/Tixeo/web2pdf-exact" target="_blank" rel="noopener" data-i18n="linkSource"></a> ·
        <a href="https://github.com/Tixeo/web2pdf-exact/issues" target="_blank" rel="noopener" data-i18n="linkIssues"></a>
      </span>
      <span class="credit" data-i18n="credit"></span>
    </footer>

    <script src="../lib/i18n.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="../lib/filename.js"></script>
    <script src="options.js"></script>
  </body>
</html>
